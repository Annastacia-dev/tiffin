<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3ec" />
    <title>Tiffin is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: #f6f3ec; color: #2a2a26; font-family: system-ui, sans-serif; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { font-family: Georgia, serif; color: #2f5d3a; margin: 12px 0 6px; font-size: 26px; }
      p { margin: 0 0 16px; color: #6d6a62; }
      button { font: inherit; font-weight: 600; border: none; border-radius: 10px; padding: 10px 16px; background: #2f5d3a; color: #fff; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/logo.svg" alt="" />
      <h1>You're offline</h1>
      <p>Tiffin needs a connection the first time you open it on this device.</p>
      <button type="button" onclick="location.href='/'">Try again</button>
    </main>
  </body>
</html>
